
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCampus - College Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>SmartCampus</h1>
        <p>College Management Portal</p>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome to SmartCampus</h2>
            <p>Your complete digital college management system.</p>
        </section>

        <section class="login-section">
            <h2>Login to Your Account</h2>

            <form id="loginForm">

                <label>Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="password"
                    placeholder="Enter password" required>

                <label>Select Role</label>
                <select id="role" required>
                    <option value="">Choose your role</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>

                <button type="submit">Login</button>

            </form>

            <p id="message"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 SmartCampus | College Management Portal</p>
    </footer>

    <script src="script.js"></script>
  <p style="text-align:center; margin:20px;">
    <a href="dashboard.html">Open Dashboard</a>
  </p>
</body>
</html>
